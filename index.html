<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>i love you</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: radial-gradient(circle at center, #0c0c16 0%, #000000 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .hint {
      position: absolute;
      top: 28px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.5s ease;
      font-weight: 500;
      text-align: center;
      padding: 0 10px;
    }
    .action-btn {
      position: absolute;
      bottom: 38px;
      z-index: 10;
      padding: 15px 38px;
      font-size: 13px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.05);
    }
    .action-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.9), 0 0 25px rgba(255, 255, 255, 0.2);
    }
    .action-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>
  <div class="hint" id="hint">Крути в 3D • Нажми на букву «К»</div>
  <canvas id="stage"></canvas>
  <button id="transformBtn" class="action-btn">Собрать сердце</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // === TAPTIC ENGINE SOUNDTRACK (Акустический дизайн виброотклика iPhone) ===
    const Haptics = {
      // Ультра-легкий тактильный тик (шестеренка/параллакс)
      tick() {
        try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {}
      },
      // Мягкий бархатный щелчок
      soft() {
        try { tg?.HapticFeedback?.impactOccurred('soft'); } catch (e) {}
      },
      // Упругий клик средней силы
      medium() {
        try { tg?.HapticFeedback?.impactOccurred('medium'); } catch (e) {}
      },
      // Острый акцент
      rigid() {
        try { tg?.HapticFeedback?.impactOccurred('rigid'); } catch (e) {}
      },
      // Глубокий резонанс
      heavy() {
        try { tg?.HapticFeedback?.impactOccurred('heavy'); } catch (e) {}
      },
      // Каскадная волна при сборке
      transformFlow() {
        this.soft();
        setTimeout(() => this.tick(), 140);
        setTimeout(() => this.tick(), 280);
        setTimeout(() => this.medium(), 520);
      },
      // Кинематографичный взрыв Supernova
      supernova() {
        this.rigid();
        setTimeout(() => this.heavy(), 65);
        setTimeout(() => this.soft(), 220);
      }
    };

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('transformBtn');
    const hint = document.getElementById('hint');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    // Кэш текстуры фразы "i love you" для идеальных 60 FPS
    const SPRITE_W = 110;
    const SPRITE_H = 32;
    const spriteCanvas = document.createElement('canvas');
    const spriteCtx = spriteCanvas.getContext('2d');

    function createCachedSprite() {
      spriteCanvas.width = SPRITE_W;
      spriteCanvas.height = SPRITE_H;
      spriteCtx.clearRect(0, 0, SPRITE_W, SPRITE_H);
      spriteCtx.shadowColor = 'rgba(255, 255, 255, 0.95)';
      spriteCtx.shadowBlur = 7;
      spriteCtx.fillStyle = '#ffffff';
      spriteCtx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
      spriteCtx.textAlign = 'center';
      spriteCtx.textBaseline = 'middle';
      spriteCtx.fillText('i love you', SPRITE_W / 2, SPRITE_H / 2);
    }
    createCachedSprite();

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const HEART_COUNT = 180;
    const LETTER_COUNT = 70;
    const TOTAL_COUNT = HEART_COUNT + LETTER_COUNT;

    let items = [];
    let sparkles = [];
    let burstParticles = [];
    let flashIntensity = 0;
    let isHeart = false;
    let animTime = 0;

    // Вращение сцены
    let rotX = 0;
    let rotY = 0;
    let velX = 0;
    let velY = 0.006;
    let isDragging = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let lastHapticAngle = 0;

    // Таймеры для анатомического двойного пульса
    let beatPhase = 0;

    function getHeart3D(t, u) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const zScale = Math.sin(t / 2) * (1 - Math.abs(y) / 22);
      const z = u * 8 * Math.max(0.3, zScale);
      return { x, y, z };
    }

    function getLetterKPoints() {
      const pts = [];
      const stemCount = Math.floor(LETTER_COUNT * 0.44);
      const branchCount = Math.floor((LETTER_COUNT - stemCount) / 2);

      const stemX = -26;
      const topY = -60;
      const botY = 40;
      const midY = -10;

      for (let i = 0; i < stemCount; i++) {
        const progress = i / (stemCount - 1);
        const y = topY + (botY - topY) * progress;
        const z = (Math.random() - 0.5) * 12;
        pts.push({ x: stemX, y, z });
      }

      for (let i = 0; i < branchCount; i++) {
        const progress = i / (branchCount - 1);
        const x = stemX + 5 + progress * 52;
        const y = midY - progress * 50;
        const z = (Math.random() - 0.5) * 12;
        pts.push({ x, y, z });
      }

      const remaining = LETTER_COUNT - pts.length;
      for (let i = 0; i < remaining; i++) {
        const progress = i / (remaining - 1);
        const x = stemX + 5 + progress * 52;
        const y = midY + progress * 50;
        const z = (Math.random() - 0.5) * 12;
        pts.push({ x, y, z });
      }
      return pts;
    }

    class TextItem3D {
      constructor(index, isLetterK, targetPos) {
        this.index = index;
        this.isLetterK = isLetterK;

        const phi = Math.acos(-1 + (2 * index) / TOTAL_COUNT);
        const theta = Math.sqrt(TOTAL_COUNT * Math.PI) * phi;
        const sphereRadius = 150;

        this.sphereX = sphereRadius * Math.cos(theta) * Math.sin(phi);
        this.sphereY = sphereRadius * Math.sin(theta) * Math.sin(phi);
        this.sphereZ = sphereRadius * Math.cos(phi);

        this.heartX = targetPos.x;
        this.heartY = targetPos.y;
        this.heartZ = targetPos.z;

        this.x = this.sphereX;
        this.y = this.sphereY;
        this.z = this.sphereZ;
        this.targetX = this.sphereX;
        this.targetY = this.sphereY;
        this.targetZ = this.sphereZ;

        this.speed = 0.038 + Math.random() * 0.02;
        this.itemScale = isLetterK ? 0.78 : 0.95;

        this.screenX = 0;
        this.screenY = 0;
      }

      update(beatVal) {
        this.x += (this.targetX - this.x) * this.speed;
        this.y += (this.targetY - this.y) * this.speed;
        this.z += (this.targetZ - this.z) * this.speed;

        if (isHeart) {
          this.targetX = this.heartX * (1 + beatVal);
          this.targetY = this.heartY * (1 + beatVal);
          this.targetZ = this.heartZ * (1 + beatVal);
        }
      }
    }

    class BurstParticle3D {
      constructor(originX, originY, originZ) {
        this.x = originX;
        this.y = originY;
        this.z = originZ;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        const speed = 4 + Math.random() * 9;

        this.vx = Math.sin(phi) * Math.cos(theta) * speed;
        this.vy = Math.sin(phi) * Math.sin(theta) * speed;
        this.vz = Math.cos(phi) * speed;

        this.life = 1.0;
        this.decay = 0.015 + Math.random() * 0.02;
        this.size = 1.6 + Math.random() * 2.0;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.z += this.vz;

        this.vx *= 0.93;
        this.vy *= 0.93;
        this.vz *= 0.93;

        this.life -= this.decay;
      }
    }

    function triggerSupernova() {
      Haptics.supernova();
      flashIntensity = 1.0;

      for (let i = 0; i < 90; i++) {
        burstParticles.push(new BurstParticle3D(
          (Math.random() - 0.5) * 20,
          -15 + (Math.random() - 0.5) * 30,
          (Math.random() - 0.5) * 20
        ));
      }
    }

    function onPointerDown(e) {
      isDragging = true;
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      pointerStartX = x;
      pointerStartY = y;
      lastMouseX = x;
      lastMouseY = y;
      velX = 0;
      velY = 0;
      lastHapticAngle = rotY;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || e.touches[0].clientX;
      const y = e.clientY || e.touches[0].clientY;
      const dx = x - lastMouseX;
      const dy = y - lastMouseY;

      rotY += dx * 0.007;
      rotX -= dy * 0.007;

      velY = dx * 0.005;
      velX = -dy * 0.005;

      // Приятные микро-тики Taptic Engine при вращении (хрустальная трещотка)
      if (Math.abs(rotY - lastHapticAngle) > 0.22) {
        Haptics.tick();
        lastHapticAngle = rotY;
      }

      lastMouseX = x;
      lastMouseY = y;
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;

      const endX = lastMouseX;
      const endY = lastMouseY;
      const dist = Math.hypot(endX - pointerStartX, endY - pointerStartY);

      if (dist < 12) {
        let clickedK = false;
        for (let item of items) {
          if (item.isLetterK) {
            const d = Math.hypot(endX - item.screenX, endY - item.screenY);
            if (d < 35) {
              clickedK = true;
              break;
            }
          }
        }

        const centerDist = Math.hypot(endX - width / 2, endY - (height / 2 - 35));
        if (clickedK || (isHeart && centerDist < 60)) {
          triggerSupernova();
        }
      }
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    class Sparkle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5 + 0.4;
        this.alpha = Math.random() * 0.4;
      }
      update() {
        this.alpha = 0.15 + Math.sin(animTime * 2.5 + this.x) * 0.15;
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      items = [];
      sparkles = [];
      burstParticles = [];
      for (let i = 0; i < 40; i++) sparkles.push(new Sparkle());

      const heartScale = 12;
      for (let i = 0; i < HEART_COUNT; i++) {
        const t = Math.PI * 2 * (i / HEART_COUNT);
        const u = (Math.random() - 0.5) * 2;
        const h = getHeart3D(t, u);
        const targetPos = {
          x: h.x * heartScale,
          y: h.y * heartScale - 15,
          z: h.z * heartScale
        };
        items.push(new TextItem3D(i, false, targetPos));
      }

      const kPoints = getLetterKPoints();
      for (let i = 0; i < kPoints.length; i++) {
        const idx = HEART_COUNT + i;
        const targetPos = {
          x: kPoints[i].x,
          y: kPoints[i].y - 15,
          z: kPoints[i].z
        };
        items.push(new TextItem3D(idx, true, targetPos));
      }
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      isHeart = !isHeart;
      btn.innerText = isHeart ? 'Рассеять сферу' : 'Собрать сердце';

      // Каскадный отклик переключения
      Haptics.transformFlow();

      items.forEach(item => {
        if (isHeart) {
          item.targetX = item.heartX;
          item.targetY = item.heartY;
          item.targetZ = item.heartZ;
        } else {
          item.targetX = item.sphereX;
          item.targetY = item.sphereY;
          item.targetZ = item.sphereZ;
        }
      });
    });

    function loop() {
      animTime += 0.02;

      if (!isDragging) {
        rotX += velX;
        rotY += velY;
        velX *= 0.96;
        velY = velY * 0.96 + 0.0004;
      }

      ctx.clearRect(0, 0, width, height);

      // Расчет анатомического биения сердца и тактильный пульс
      let beat = 0;
      if (isHeart) {
        const prevPhase = beatPhase;
        beatPhase = (animTime * 2.2) % (Math.PI * 2);

        if (beatPhase < 0.6) {
          beat = Math.sin(beatPhase * (Math.PI / 0.6)) * 0.06;
          // Первый удар (глубокий)
          if (prevPhase > 5.5 || beatPhase < 0.05) {
            Haptics.soft();
          }
        } else if (beatPhase > 0.8 && beatPhase < 1.3) {
          beat = Math.sin((beatPhase - 0.8) * (Math.PI / 0.5)) * 0.035;
          // Второй удар (эхо)
          if (prevPhase <= 0.8 && beatPhase > 0.8) {
            Haptics.tick();
          }
        }
      }

      // Вспышка в центре
      if (flashIntensity > 0.01) {
        const grad = ctx.createRadialGradient(
          width / 2, height / 2 - 35, 5,
          width / 2, height / 2 - 35, 200
        );
        grad.addColorStop(0, `rgba(255, 255, 255, ${flashIntensity * 0.4})`);
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
        flashIntensity *= 0.92;
      }

      for (let s of sparkles) {
        s.update();
        s.draw();
      }

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      const fov = 380;
      const centerY = height / 2 - 20;
      const renderList = [];

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        item.update(beat);

        let x1 = item.x * cosY - item.z * sinY;
        let z1 = item.z * cosY + item.x * sinY;

        let y1 = item.y * cosX - z1 * sinX;
        let z2 = z1 * cosX + item.y * sinX;

        const cameraDistance = 330;
        const scale = fov / (fov + z2 + cameraDistance);

        item.screenX = width / 2 + x1 * scale;
        item.screenY = centerY + y1 * scale;

        const baseAlpha = item.isLetterK ? 1.0 : 0.85;
        const depthAlpha = Math.max(0.15, Math.min(baseAlpha, (z2 + 220) / 340));

        renderList.push({
          type: 'text',
          x: item.screenX,
          y: item.screenY,
          z: z2,
          scale: scale * item.itemScale,
          alpha: depthAlpha
        });
      }

      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.update();
        if (bp.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        let x1 = bp.x * cosY - bp.z * sinY;
        let z1 = bp.z * cosY + bp.x * sinY;
        let y1 = bp.y * cosX - z1 * sinX;
        let z2 = z1 * cosX + bp.y * sinX;

        const cameraDistance = 330;
        const scale = fov / (fov + z2 + cameraDistance);

        renderList.push({
          type: 'particle',
          x: width / 2 + x1 * scale,
          y: centerY + y1 * scale,
          z: z2,
          size: bp.size * scale,
          alpha: bp.life
        });
      }

      renderList.sort((a, b) => a.z - b.z);

      for (let i = 0; i < renderList.length; i++) {
        const p = renderList[i];
        if (p.type === 'text') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(p.scale, p.scale);
          ctx.globalAlpha = p.alpha;
          ctx.drawImage(spriteCanvas, -SPRITE_W / 2, -SPRITE_H / 2);
          ctx.restore();
        } else if (p.type === 'particle') {
          ctx.save();
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
          ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
