<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>For You</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background-color: #05050a;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Плавающее свечение ауры на фоне */
    .nebula {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 0;
      opacity: 0;
      transition: opacity 2.5s cubic-bezier(0.16, 1, 0.3, 1);
      background: radial-gradient(circle at 50% 45%, rgba(68, 28, 86, 0.28) 0%, rgba(18, 14, 40, 0.45) 45%, #05050a 85%);
      pointer-events: none;
    }
    .nebula.active {
      opacity: 1;
    }
    /* Стартовая подсказка этапа 1 */
    .touch-target {
      position: absolute;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .touch-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 20px #ffffff, 0 0 40px rgba(255, 255, 255, 0.8);
      animation: pulseDot 2.2s infinite ease-in-out;
      margin-bottom: 16px;
    }
    .touch-text {
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      font-weight: 400;
      animation: fadeInOut 2.2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 28px #ffffff, 0 0 60px rgba(255, 200, 220, 0.9); }
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.35; transform: translateY(0); }
      50% { opacity: 0.85; transform: translateY(-2px); }
    }
    /* Информационная строка этапов */
    .status-badge {
      position: absolute;
      top: 32px;
      z-index: 10;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 500;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
      text-align: center;
    }
    /* Кнопка перехода к этапу 3 */
    .action-btn {
      position: absolute;
      bottom: 40px;
      z-index: 15;
      padding: 16px 42px;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.05);
    }
    .action-btn.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }
    .action-btn:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <div class="nebula" id="nebula"></div>
  <div class="status-badge" id="statusBadge">Созвездие чувств</div>

  <!-- Начальный триггер этапа 1 -->
  <div class="touch-target" id="touchTrigger">
    <div class="touch-dot"></div>
    <div class="touch-text">прикоснись</div>
  </div>

  <canvas id="stage"></canvas>
  <button id="actionBtn" class="action-btn">Собрать воедино ✨</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    // === TAPTIC ENGINE SOUNDTRACK (Акустический дизайн виброотклика iPhone) ===
    const Haptics = {
      tick() {
        try { tg?.HapticFeedback?.selectionChanged(); } catch (e) {}
      },
      soft() {
        try { tg?.HapticFeedback?.impactOccurred('soft'); } catch (e) {}
      },
      medium() {
        try { tg?.HapticFeedback?.impactOccurred('medium'); } catch (e) {}
      },
      rigid() {
        try { tg?.HapticFeedback?.impactOccurred('rigid'); } catch (e) {}
      },
      heavy() {
        try { tg?.HapticFeedback?.impactOccurred('heavy'); } catch (e) {}
      },
      success() {
        try { tg?.HapticFeedback?.notificationOccurred('success'); } catch (e) {}
      },

      // Этап 1 -> Этап 2: Большой взрыв (Big Bang)
      bigBang() {
        this.rigid();
        setTimeout(() => this.heavy(), 50);
        setTimeout(() => this.medium(), 180);
        setTimeout(() => this.soft(), 360);
        setTimeout(() => this.tick(), 520);
      },

      // Этап 2 -> Этап 3: Каскадное притяжение
      assembleFlow() {
        this.soft();
        setTimeout(() => this.tick(), 140);
        setTimeout(() => this.tick(), 280);
        setTimeout(() => this.tick(), 420);
        setTimeout(() => this.medium(), 600);
        setTimeout(() => this.success(), 850);
      },

      // Золотая сверхновая при клике на букву К
      goldSupernova() {
        this.rigid();
        setTimeout(() => this.heavy(), 60);
        setTimeout(() => this.medium(), 150);
        setTimeout(() => this.soft(), 280);
        setTimeout(() => this.tick(), 420);
      }
    };

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const nebula = document.getElementById('nebula');
    const statusBadge = document.getElementById('statusBadge');
    const touchTrigger = document.getElementById('touchTrigger');
    const actionBtn = document.getElementById('actionBtn');

    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    // === СОЗДАНИЕ ДВУХ КЭШ-СПРАЙТОВ (Белый жемчуг + Сияющее золото) ===
    const SPRITE_W = 110;
    const SPRITE_H = 32;

    // 1. Белый жемчуг (для внешнего сердца)
    const whiteSprite = document.createElement('canvas');
    whiteSprite.width = SPRITE_W;
    whiteSprite.height = SPRITE_H;
    const wCtx = whiteSprite.getContext('2d');
    wCtx.shadowColor = 'rgba(255, 255, 255, 0.95)';
    wCtx.shadowBlur = 8;
    wCtx.fillStyle = '#ffffff';
    wCtx.font = '600 13px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
    wCtx.textAlign = 'center';
    wCtx.textBaseline = 'middle';
    wCtx.fillText('i love you', SPRITE_W / 2, SPRITE_H / 2);

    // 2. Теплое сияющее золото (для буквы К)
    const goldSprite = document.createElement('canvas');
    goldSprite.width = SPRITE_W;
    goldSprite.height = SPRITE_H;
    const gCtx = goldSprite.getContext('2d');
    gCtx.shadowColor = 'rgba(255, 205, 110, 0.95)';
    gCtx.shadowBlur = 9;
    gCtx.fillStyle = '#ffdf88';
    gCtx.font = '700 13px -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif';
    gCtx.textAlign = 'center';
    gCtx.textBaseline = 'middle';
    gCtx.fillText('i love you', SPRITE_W / 2, SPRITE_H / 2);

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    // Этапы: 1 = Темнота, 2 = Созвездие (Галактика), 3 = Сердце с буквой К
    let currentStage = 1;

    const HEART_COUNT = 185;
    const LETTER_COUNT = 75;
    const TOTAL_COUNT = HEART_COUNT + LETTER_COUNT;

    let items = [];
    let sparkles = [];
    let burstParticles = [];
    let flashIntensity = 0;
    let animTime = 0;
    let prevPhase = 0;

    // Вращение сцены
    let rotX = 0;
    let rotY = 0;
    let velX = 0;
    let velY = 0.005;
    let isDragging = false;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let lastHapticAngle = 0;

    function getHeart3D(t, u) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      const zScale = Math.sin(t / 2) * (1 - Math.abs(y) / 22);
      const z = u * 8 * Math.max(0.3, zScale);
      return { x, y, z };
    }

    function getLetterKPoints() {
      const pts = [];
      const stemCount = Math.floor(LETTER_COUNT * 0.44);
      const branchCount = Math.floor((LETTER_COUNT - stemCount) / 2);

      const stemX = -28;
      const topY = -62;
      const botY = 42;
      const midY = -10;

      for (let i = 0; i < stemCount; i++) {
        const progress = i / (stemCount - 1);
        const y = topY + (botY - topY) * progress;
        const z = (Math.random() - 0.5) * 14;
        pts.push({ x: stemX, y, z });
      }

      for (let i = 0; i < branchCount; i++) {
        const progress = i / (branchCount - 1);
        const x = stemX + 6 + progress * 54;
        const y = midY - progress * 52;
        const z = (Math.random() - 0.5) * 14;
        pts.push({ x, y, z });
      }

      const remaining = LETTER_COUNT - pts.length;
      for (let i = 0; i < remaining; i++) {
        const progress = i / (remaining - 1);
        const x = stemX + 6 + progress * 54;
        const y = midY + progress * 52;
        const z = (Math.random() - 0.5) * 14;
        pts.push({ x, y, z });
      }
      return pts;
    }

    class TextItem3D {
      constructor(index, isLetterK, targetHeartPos) {
        this.index = index;
        this.isLetterK = isLetterK;

        // В этапе 1 все точки сжаты в центральную микро-сингулярность
        this.x = (Math.random() - 0.5) * 4;
        this.y = (Math.random() - 0.5) * 4;
        this.z = (Math.random() - 0.5) * 4;

        this.targetX = this.x;
        this.targetY = this.y;
        this.targetZ = this.z;

        // Координаты галактики (Этап 2: спиральное облако)
        const phi = Math.acos(-1 + (2 * index) / TOTAL_COUNT);
        const theta = Math.sqrt(TOTAL_COUNT * Math.PI) * phi;
        const rSphere = 140 + Math.random() * 35;

        this.galaxyX = rSphere * Math.cos(theta) * Math.sin(phi);
        this.galaxyY = rSphere * Math.sin(theta) * Math.sin(phi);
        this.galaxyZ = rSphere * Math.cos(phi);

        // Координаты сердца и буквы К (Этап 3)
        this.heartX = targetHeartPos.x;
        this.heartY = targetHeartPos.y;
        this.heartZ = targetHeartPos.z;

        this.speed = 0.035 + Math.random() * 0.02;
        this.itemScale = isLetterK ? 0.8 : 0.95;
        this.opacity = 0; // скрыты в этапе 1

        this.screenX = 0;
        this.screenY = 0;
      }

      update(beatVal) {
        this.x += (this.targetX - this.x) * this.speed;
        this.y += (this.targetY - this.y) * this.speed;
        this.z += (this.targetZ - this.z) * this.speed;

        if (currentStage === 3) {
          this.targetX = this.heartX * (1 + beatVal);
          this.targetY = this.heartY * (1 + beatVal);
          this.targetZ = this.heartZ * (1 + beatVal);
        }
      }
    }

    class BurstParticle3D {
      constructor(originX, originY, originZ) {
        this.x = originX;
        this.y = originY;
        this.z = originZ;

        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(Math.random() * 2 - 1);
        const speed = 4 + Math.random() * 9;

        this.vx = Math.sin(phi) * Math.cos(theta) * speed;
        this.vy = Math.sin(phi) * Math.sin(theta) * speed;
        this.vz = Math.cos(phi) * speed;

        this.life = 1.0;
        this.decay = 0.015 + Math.random() * 0.02;
        this.size = 1.8 + Math.random() * 2.2;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.z += this.vz;
        this.vx *= 0.93;
        this.vy *= 0.93;
        this.vz *= 0.93;
        this.life -= this.decay;
      }
    }

    function triggerGoldSupernova() {
      Haptics.goldSupernova();
      flashIntensity = 1.0;

      for (let i = 0; i < 95; i++) {
        burstParticles.push(new BurstParticle3D(
          (Math.random() - 0.5) * 20,
          -15 + (Math.random() - 0.5) * 30,
          (Math.random() - 0.5) * 20
        ));
      }
    }

    // === ПЕРЕХОДЫ ЭТАПОВ ===

    // Переход 1 -> 2: Рождение созвездия
    function startStageTwo() {
      if (currentStage !== 1) return;
      currentStage = 2;

      Haptics.bigBang();
      flashIntensity = 1.2;

      // Скрываем стартовую подсказку, зажигаем ауру
      touchTrigger.style.opacity = '0';
      touchTrigger.style.pointerEvents = 'none';
      setTimeout(() => touchTrigger.remove(), 800);

      nebula.classList.add('active');
      statusBadge.innerText = 'Созвездие «i love you»';
      statusBadge.style.opacity = '0.5';

      // Разлетаются в галактику
      items.forEach(item => {
        item.targetX = item.galaxyX;
        item.targetY = item.galaxyY;
        item.targetZ = item.galaxyZ;
        item.opacity = 1;
      });

      // Показываем кнопку перехода к сердцу
      setTimeout(() => {
        actionBtn.classList.add('visible');
      }, 1400);
    }

    // Переход 2 -> 3: Сборка сердца с золотой буквой К
    function startStageThree() {
      if (currentStage !== 2) return;
      currentStage = 3;

      Haptics.assembleFlow();
      actionBtn.classList.remove('visible');

      statusBadge.innerText = 'Нажми на золотую «К»';
      statusBadge.style.opacity = '0.7';

      items.forEach(item => {
        item.targetX = item.heartX;
        item.targetY = item.heartY;
        item.targetZ = item.heartZ;
      });
    }

    touchTrigger.addEventListener('click', startStageTwo);
    actionBtn.addEventListener('click', startStageThree);

    // Управление жестами (свайп вращения + клик по букве К)
    function onPointerDown(e) {
      if (currentStage === 1) {
        startStageTwo();
        return;
      }

      isDragging = true;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);
      pointerStartX = x;
      pointerStartY = y;
      lastMouseX = x;
      lastMouseY = y;
      velX = 0;
      velY = 0;
      lastHapticAngle = rotY;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const y = e.clientY || (e.touches && e.touches[0].clientY);
      const dx = x - lastMouseX;
      const dy = y - lastMouseY;

      rotY += dx * 0.007;
      rotX -= dy * 0.007;

      velY = dx * 0.005;
      velX = -dy * 0.005;

      if (Math.abs(rotY - lastHapticAngle) > 0.22) {
        Haptics.tick();
        lastHapticAngle = rotY;
      }

      lastMouseX = x;
      lastMouseY = y;
    }

    function onPointerUp(e) {
      if (!isDragging) return;
      isDragging = false;

      const endX = lastMouseX;
      const endY = lastMouseY;
      const dist = Math.hypot(endX - pointerStartX, endY - pointerStartY);

      // Короткий клик
      if (dist < 12 && currentStage === 3) {
        let clickedK = false;
        for (let item of items) {
          if (item.isLetterK) {
            const d = Math.hypot(endX - item.screenX, endY - item.screenY);
            if (d < 38) {
              clickedK = true;
              break;
            }
          }
        }

        const centerDist = Math.hypot(endX - width / 2, endY - (height / 2 - 35));
        if (clickedK || centerDist < 65) {
          triggerGoldSupernova();
        }
      }
    }

    window.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    window.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    class Sparkle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 1.5 + 0.4;
        this.alpha = Math.random() * 0.4;
      }
      update() {
        this.alpha = 0.15 + Math.sin(animTime * 2.5 + this.x) * 0.15;
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      items = [];
      sparkles = [];
      burstParticles = [];
      for (let i = 0; i < 45; i++) sparkles.push(new Sparkle());

      // 1. Создаем внешнее сердце (жемчуг)
      const heartScale = 12;
      for (let i = 0; i < HEART_COUNT; i++) {
        const t = Math.PI * 2 * (i / HEART_COUNT);
        const u = (Math.random() - 0.5) * 2;
        const h = getHeart3D(t, u);
        const targetPos = {
          x: h.x * heartScale,
          y: h.y * heartScale - 15,
          z: h.z * heartScale
        };
        items.push(new TextItem3D(i, false, targetPos));
      }

      // 2. Создаем центральную букву К (золото)
      const kPoints = getLetterKPoints();
      for (let i = 0; i < kPoints.length; i++) {
        const idx = HEART_COUNT + i;
        const targetPos = {
          x: kPoints[i].x,
          y: kPoints[i].y - 15,
          z: kPoints[i].z
        };
        items.push(new TextItem3D(idx, true, targetPos));
      }
    }

    function loop() {
      animTime += 0.02;

      // Инерция
      if (!isDragging && currentStage > 1) {
        const speed = Math.hypot(velX, velY);
        rotX += velX;
        rotY += velY;

        if (speed > 0.015 && Math.abs(rotY - lastHapticAngle) > 0.35) {
          Haptics.tick();
          lastHapticAngle = rotY;
        }

        velX *= 0.96;
        velY = velY * 0.96 + 0.0004;
      }

      ctx.clearRect(0, 0, width, height);

      // Анатомический пульс сердца в этапе 3
      let beat = 0;
      if (currentStage === 3) {
        const currentPhase = (animTime * 2.2) % (Math.PI * 2);

        if (currentPhase < 0.6) {
          beat = Math.sin(currentPhase * (Math.PI / 0.6)) * 0.065;
          if (prevPhase > 5.5 || currentPhase < 0.08) {
            Haptics.soft();
          }
        } else if (currentPhase > 0.8 && currentPhase < 1.3) {
          beat = Math.sin((currentPhase - 0.8) * (Math.PI / 0.5)) * 0.038;
          if (prevPhase <= 0.8 && currentPhase > 0.8) {
            Haptics.tick();
          }
        }
        prevPhase = currentPhase;
      }

      // Вспышка взрыва
      if (flashIntensity > 0.01) {
        const grad = ctx.createRadialGradient(
          width / 2, height / 2 - 35, 5,
          width / 2, height / 2 - 35, 230
        );
        grad.addColorStop(0, `rgba(255, 225, 170, ${flashIntensity * 0.45})`);
        grad.addColorStop(1, 'rgba(255, 225, 170, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
        flashIntensity *= 0.92;
      }

      if (currentStage > 1) {
        for (let s of sparkles) {
          s.update();
          s.draw();
        }
      }

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX);
      const sinX = Math.sin(rotX);

      const fov = 380;
      const centerY = height / 2 - 20;
      const renderList = [];

      // 3D рендер надписей (только со 2 этапа)
      if (currentStage > 1) {
        for (let i = 0; i < items.length; i++) {
          const item = items[i];
          item.update(beat);

          let x1 = item.x * cosY - item.z * sinY;
          let z1 = item.z * cosY + item.x * sinY;

          let y1 = item.y * cosX - z1 * sinX;
          let z2 = z1 * cosX + item.y * sinX;

          const cameraDistance = 330;
          const scale = fov / (fov + z2 + cameraDistance);

          item.screenX = width / 2 + x1 * scale;
          item.screenY = centerY + y1 * scale;

          const baseAlpha = item.isLetterK ? 1.0 : 0.88;
          const depthAlpha = Math.max(0.15, Math.min(baseAlpha, (z2 + 220) / 340));

          renderList.push({
            type: 'text',
            isGold: item.isLetterK && currentStage === 3,
            x: item.screenX,
            y: item.screenY,
            z: z2,
            scale: scale * item.itemScale,
            alpha: depthAlpha
          });
        }
      }

      // Золотые кометы взрыва
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        const bp = burstParticles[i];
        bp.update();
        if (bp.life <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        let x1 = bp.x * cosY - bp.z * sinY;
        let z1 = bp.z * cosY + bp.x * sinY;
        let y1 = bp.y * cosX - z1 * sinX;
        let z2 = z1 * cosX + bp.y * sinX;

        const cameraDistance = 330;
        const scale = fov / (fov + z2 + cameraDistance);

        renderList.push({
          type: 'particle',
          x: width / 2 + x1 * scale,
          y: centerY + y1 * scale,
          z: z2,
          size: bp.size * scale,
          alpha: bp.life
        });
      }

      renderList.sort((a, b) => a.z - b.z);

      for (let i = 0; i < renderList.length; i++) {
        const p = renderList[i];
        if (p.type === 'text') {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.scale(p.scale, p.scale);
          ctx.globalAlpha = p.alpha;
          // В этапе 3 буква К рендерится из золотого спрайта
          const sprite = p.isGold ? goldSprite : whiteSprite;
          ctx.drawImage(sprite, -SPRITE_W / 2, -SPRITE_H / 2);
          ctx.restore();
        } else if (p.type === 'particle') {
          ctx.save();
          ctx.fillStyle = `rgba(255, 215, 120, ${p.alpha})`;
          ctx.shadowColor = 'rgba(255, 200, 90, 0.95)';
          ctx.shadowBlur = 9;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      requestAnimationFrame(loop);
    }

    init();
    loop();
  </script>
</body>
</html>
